services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: pvp-docker:1.0.0

    container_name: pvp-app

    ports:
      - "${APP_PORT}:3000"

    environment:
      PORT: 3000

      DB_HOST: db
      DB_PORT: 3306

      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - pvp_network

    restart: unless-stopped


  db:
    image: mysql:8.4

    container_name: pvp-db

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - pvp_mysql_data:/var/lib/mysql

    networks:
      - pvp_network

    healthcheck:
      test:
        ["CMD-SHELL","mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]

      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


networks:

  pvp_network:
    name: pvp_network
    driver: bridge


volumes:

  pvp_mysql_data:
    external: true